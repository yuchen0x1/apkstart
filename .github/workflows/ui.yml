name: Isolated UI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fixture:
    name: Electron 沙箱与界面（${{ matrix.platform }} 能力夹具）
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [win32, linux]
    env:
      UI_AUDIT_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: 设置隔离截图目录
        shell: pwsh
        run: |
          "UI_AUDIT_DIR=$env:RUNNER_TEMP/apkstart-ui-$env:UI_AUDIT_PLATFORM" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖与 Electron
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
      # 仅加载内存 IPC 夹具，不执行产品 main，不连接设备或自动部署运行时。
      - name: 沙箱与 preload 冒烟
        run: npm run test:electron
      - name: 双主题和交互回归
        run: npm run test:ui
      - name: 保留失败时的夹具截图与检查结果
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-${{ matrix.platform }}
          path: ${{ env.UI_AUDIT_DIR }}
          if-no-files-found: ignore
          retention-days: 7
