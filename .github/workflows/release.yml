name: Release
# 运行列表里显示「发布 v0.6.4」而不是提交信息——提交信息五花八门
# （release: / chore(release): / 长短不一的句子），按版本找运行记录时根本没法看。
run-name: ${{ github.ref_type == 'tag' && format('发布 {0}', github.ref_name) || '手动构建发布' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ui:
    uses: ./.github/workflows/ui.yml

  # 先跑一次测试。测试通过后才创建 Release，避免失败的构建留下空 Release。
  verify:
    name: 测试（Windows / Node ${{ matrix.node }}）
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 测试
        run: npm test

  # 发布前必须同时通过 Linux 测试；否则不能创建只有 Windows 资产的 Release。
  verify-linux:
    name: 测试（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 测试
        run: npm test

      - name: 系统镜像体积闸门
        run: node build/check-no-images.js --git

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$tag" = "$GITHUB_REF_NAME"
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 Windows 便携版
    needs: [version, verify, verify-linux, verify-ui]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 Electron 运行时）
        run: npm ci

      # Electron 45 的 npm 包不再提供 postinstall：npm ci 只装 JS 包，dist/ 要显式下载。
      # 少了这一步，build/pack.js 会在「复制 Electron 运行时」处 ENOENT（v0.6.7 实测）。
      - name: 下载 Electron 二进制
        run: node node_modules/electron/install.js

      - name: 打包便携版
        run: npm run pack

      # 用 7-Zip 而不是 Compress-Archive：同一个目录，.NET deflate 压出来比 7-Zip -mx=9
      # 大 5MB 以上。build/zip.js 带体积闸门，超过上限直接让 job 失败，避免以后又悄悄
      # 退回分片包。闸门 160MiB：Electron 33 → 45 之后壳层从 225MB 长到 327MB
      # （electron.exe 单文件 238MB），压后实测 140.85MiB，留一点余量。
      - name: 压缩产物（7-Zip，体积闸门 160MiB）
        shell: pwsh
        run: |
          $tag = $env:TAG
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 160
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: portable
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
          path: |
            ApkStart-v*-win64-portable.zip

  full:
    name: 构建 Windows 在线安装版
    needs: [version, verify, verify-linux, verify-ui]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 同上：Electron 45 起 dist/ 不再由 npm ci 自动下载。
      - name: 下载 Electron 二进制
        run: node node_modules/electron/install.js

      # 先生成便携目录；test:packaged 会同时校验便携版和 NSIS 展开目录。
      - name: 打包便携版供最终产物校验
        run: npm run pack

      - name: 构建在线安装包
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 校验最终 Windows 构建包
        run: npm run test:packaged

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: installer
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
          path: |
            dist/release/*Setup.exe

  linux:
    name: 构建 Linux 版（AppImage / deb，在线运行时）
    needs: [version, verify, verify-linux, verify-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.version.outputs.tag }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 下载 Electron 二进制
        run: node node_modules/electron/install.js

      - name: 构建 AppImage 与 deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
          path: |
            dist/release/*.AppImage
            dist/release/*.deb

  publish:
    if: github.ref_type == 'tag'
    needs: [version, build, full, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: 签署更新清单
        env:
          APKSTART_RELEASE_KEY: ${{ secrets.APKSTART_RELEASE_KEY }}
        run: |
          node tools/release-notes.js "$TAG" --out RELEASE_NOTES.md
          node tools/sign-release.js "$TAG" artifacts RELEASE_NOTES.md
      - name: 在草稿中核对全部文件后发布
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '该版本已有发行记录，请检查现有发行或草稿' >&2; exit 1
          fi
          gh release create "$TAG" --draft --verify-tag --title "ApkStart $TAG" --notes-file RELEASE_NOTES.md artifacts/*
          gh release view "$TAG" --json assets > uploaded.json
          node tools/sign-release.js --check-upload artifacts uploaded.json
          gh release edit "$TAG" --draft=false --latest
