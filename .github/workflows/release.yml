name: Release
# 运行列表里显示「发布 v0.6.4」而不是提交信息——提交信息五花八门
# （release: / chore(release): / 长短不一的句子），按版本找运行记录时根本没法看。
run-name: ${{ github.ref_type == 'tag' && format('发布 {0}', github.ref_name) || '手动构建发布' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先跑一次测试。测试通过后才创建 Release，避免失败的构建留下空 Release。
  verify:
    name: 测试
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 测试
        run: npm test

  # Release 元数据单独准备，后面的便携版和完整版可以并行构建。
  release:
    name: 创建 Release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布版本：$tag"

      # 发行说明统一由 tools/release-notes.js 产出（手写 release-notes 文件 → CHANGELOG
      # 段落 → git log 三级兜底），正文一律去掉重复的版本大标题，并自动补齐下载、升级、
      # 支持范围等每版都必须保留的基础信息。
      - name: 生成发行说明
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: node tools/release-notes.js "$TAG" --out RELEASE_NOTES.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json tagName -q .tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ApkStart $TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "ApkStart $TAG" --notes-file RELEASE_NOTES.md
          fi

  build:
    name: 构建便携版并发布
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 Electron 运行时）
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # Electron 45 的 npm 包不再提供 postinstall：npm ci 只装 JS 包，dist/ 要显式下载。
      # 少了这一步，build/pack.js 会在「复制 Electron 运行时」处 ENOENT（v0.6.7 实测）。
      - name: 下载 Electron 二进制
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 打包便携版
        run: npm run pack

      # 用 7-Zip 而不是 Compress-Archive：同一个目录，.NET deflate 压出来比 7-Zip -mx=9
      # 大 5MB 以上。build/zip.js 带体积闸门，超过上限直接让 job 失败，避免以后又悄悄
      # 退回分片包。闸门 160MiB：Electron 33 → 45 之后壳层从 225MB 长到 327MB
      # （electron.exe 单文件 238MB），压后实测 140.85MiB，留一点余量。
      - name: 压缩产物（7-Zip，体积闸门 160MiB）
        shell: pwsh
        run: |
          $tag = $env:TAG
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 160
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # Release 已由 release job 创建；便携版和完整版在这里并行上传各自资产。
      - name: 上传轻量便携版到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:TAG
          $zip = "ApkStart-$tag-win64-portable.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

  full:
    name: 构建完整版（内置运行时，离线开箱即用）
    needs: release
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      # electron-builder 的 NSIS/7-Zip 工具缓存放在工作区，便于 actions/cache 复用。
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # 同上：Electron 45 起 dist/ 不再由 npm ci 自动下载。
      - name: 下载 Electron 二进制
        run: node node_modules/electron/install.js
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 缓存 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-v1-${{ hashFiles('package-lock.json') }}

      # 完整运行时约 1GB，最慢的是每版重新下载并压缩 system.img。
      # 缓存键只由运行时构建逻辑和运行时兼容代码决定；普通应用/文档改动会直接命中缓存。
      # 如果需要主动刷新上游 Android 运行时，把 runtime-v1 改成 runtime-v2。
      - name: 恢复完整运行时缓存
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: ${{ runner.os }}-apkstart-runtime-v1-${{ hashFiles('build/fetch-runtime.js', 'build/prepare-runtime.js', 'build/slim-runtime.js', 'src/core/layers.js', 'src/core/provision.js', 'src/core/download.js', 'build/seed/userdata.img.gz', 'build/vendor/opengl32sw.dll') }}

      # 从 Google 官方源组装运行时（emulator + platform-tools + aehd + Play x86_64 镜像）。
      # 只有缓存未命中时才执行；命中时直接复用上一个版本已经验证过的运行时。
      - name: 组装运行时
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node build/fetch-runtime.js engine

      # prepare-runtime 会把 system.img/vendor.img 压成 xz(LZMA2)。
      # CI runner 只有 2 核：XZ_PRESET=6 把压缩时间从 ~2h 降到 ~40min（体积 +3%）。
      # XZ_TIMEOUT_MS 是看门狗：超时自动 kill 并落 gzip 兜底，
      # 绝不重演「stdin 没接 EOF → 0 字节输出 → 挂死 3 小时」。
      - name: 准备运行时（xz 压缩，CI 降档加速）
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      - name: 校验完整运行时
        shell: pwsh
        run: |
          $required = @(
            'build\runtime\emulator\emulator.exe',
            'build\runtime\platform-tools\adb.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "运行时缓存或构建产物缺少：$path" }
          }
          $images = @(
            'build\runtime\system-images\android-34\google_apis_playstore\x86_64\system.img.xz',
            'build\runtime\system-images\android-34\google_apis_playstore\x86_64\system.img.gz'
          )
          if (-not ($images | Where-Object { Test-Path $_ })) {
            throw '运行时缓存或构建产物缺少 system.img 压缩文件'
          }
          Write-Output "完整运行时可用"

      # 内置微软 VC++ 2015-2022 x64 运行库：安卓模拟器（Qt6）与 qemu 都依赖它，
      # 缺了在「其他电脑」上会直接起不来（0xc0000135 / MSVCP140 缺失）。
      # 放到 build/runtime 内，随 extraResources 一起打进安装包；离线也能一键安装。
      - name: 下载 VC++ 运行库（离线内置）
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "下载 VC++ 2015-2022 x64 运行库…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "vc_redist 下载失败" }
          Get-Item $out | Select-Object Name, Length

      # 不打 git tag 时 electron-builder 不会隐式发布；这里显式 --publish never，
      # 安装包由后面的上传步骤用 gh release upload 上传。
      - name: 构建完整版安装包
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传完整版到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:TAG
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "未找到 Setup.exe"; exit 1 }
          Write-Output ("上传 {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # 轻量版（不带运行时）不再去 dl.google.com 逐个下 emulator / 系统镜像，
      # 而是直接下这一个整包 —— 下载源与「软件更新」同为本项目 GitHub Release，
      # 国内网络稳定性、出问题后的排障都只在一个地方。
      # 内容已经是 .xz 压缩过的镜像，这里用 bsdtar 直接打 zip（不再二次压缩，省几十分钟）。
      - name: 打包运行时整包（轻量版下载源）
        shell: pwsh
        run: |
          $tag = $env:TAG
          $zip = "ApkStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime 不完整"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "打包运行时失败"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传运行时整包到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:TAG
          $zip = "ApkStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
