name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（Windows / Node ${{ matrix.node }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 单元测试不需要 Electron 二进制，跳过 188MB 下载以加快 CI
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行测试
        run: npm test

      # 确保大型 Android 系统镜像没有混进 git 仓库/默认安装包（必须走远程目录按需下载）
      - name: 系统镜像体积闸门
        run: node build/check-no-images.js --git

      # 直接驱动 agent.ps1 内嵌 C# 的钩子回调，防止键位映射被改坏
      - name: 鼠标钩子逻辑冒烟测试
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }

  # Linux 单元测试（v0.7 起 Linux 是受支持平台）：同一套测试在 Ubuntu 上跑。
  # Windows 专属用例（鼠标钩子/PowerShell 真机执行等）在测试内部自行跳过。
  test-linux:
    name: 单元测试（Linux / Node 22）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行测试
        run: npm test

      - name: 系统镜像体积闸门
        run: node build/check-no-images.js --git
